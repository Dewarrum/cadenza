name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running one instead of cutting it off.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Secrets cannot appear in a job's `if`, so this job reports whether the
  # Cloudflare token exists. Until the owner adds it, the Pages job is
  # skipped and Pages is deployed from the laptop (see README).
  pages-token:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; the Pages deploy is skipped."
          fi

  pages:
    needs: pages-token
    if: needs.pages-token.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes wrangler@4 pages deploy dist --project-name cadenza --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
